<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Site Settings</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .admin-form {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn-save {
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-save:hover {
            background: #45a049;
        }
        .btn-delete {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-edit {
            background: #2196F3;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: #f9f9f9;
            border-radius: 10px;
        }
        .hidden { display: none; }
        .nav-links {
            margin-bottom: 20px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
        }
        .nav-links a {
            margin-right: 20px;
            color: #0a2647;
            text-decoration: none;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        .team-member-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .team-photo-small {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }
        .photo-placeholder {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .team-info {
            flex: 1;
        }
        .section-title {
            margin: 30px 0 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #0a2647;
        }
        .photo-preview {
            margin-top: 10px;
        }
        .photo-preview img {
            max-width: 100px;
            max-height: 100px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="login-form" class="login-form">
    <h2>Admin Login</h2>
    <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="admin">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>
    <button onclick="login()" class="btn-save">Login</button>
</div>

<div id="admin-panel" class="admin-container hidden">
    <div class="admin-header">
        <h2>Site Settings</h2>
        <button onclick="logout()" style="background: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Logout</button>
    </div>
    
    <div class="nav-links">
        <a href="index.html" target="_blank"><i class="fas fa-home"></i> Home</a>
        <a href="about.html" target="_blank"><i class="fas fa-info-circle"></i> About</a>
        <a href="work.html" target="_blank"><i class="fas fa-briefcase"></i> Our Work</a>
        <a href="contact.html" target="_blank"><i class="fas fa-envelope"></i> Contact</a>
    </div>
    
    <!-- Site Settings Form -->
    <form id="settings-form" class="admin-form">
        <h3>📞 Contact Information</h3>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="contact_email" required>
        </div>
        
        <div class="form-group">
            <label>Phone *</label>
            <input type="text" id="contact_phone" required>
        </div>
        
        <div class="form-group">
            <label>Address *</label>
            <textarea id="contact_address" rows="2" required></textarea>
        </div>
        
        <div class="form-group">
            <label>Address Note</label>
            <input type="text" id="address_note">
        </div>
        
        <div class="form-group">
            <label>Business Hours</label>
            <input type="text" id="business_hours">
        </div>
        
        <h3>🌐 Social Media</h3>
        <div class="form-group">
            <label>Facebook URL</label>
            <input type="url" id="facebook_url">
        </div>
        
        <div class="form-group">
            <label>Instagram URL</label>
            <input type="url" id="instagram_url">
        </div>
        
        <div class="form-group">
            <label>WhatsApp URL</label>
            <input type="url" id="whatsapp_url">
        </div>
        
        <div class="form-group">
            <label>LinkedIn URL</label>
            <input type="url" id="linkedin_url">
        </div>
        
        <h3>📄 Footer</h3>
        <div class="form-group">
            <label>Copyright Text</label>
            <input type="text" id="copyright_text">
        </div>
        
        <button type="submit" class="btn-save">Save Site Settings</button>
    </form>
    
    <!-- Team Members Management -->
    <h2 class="section-title">👥 Team Members</h2>
    
    <!-- Add/Edit Team Member Form -->
    <div class="admin-form" id="team-form">
        <h3 id="team-form-title">Add New Team Member</h3>
        <input type="hidden" id="team-id" value="">
        
        <div class="form-group">
            <label>Name *</label>
            <input type="text" id="team-name" required>
        </div>
        
        <div class="form-group">
            <label>Role/Position *</label>
            <input type="text" id="team-role" required>
        </div>
        
        <div class="form-group">
            <label>Qualifications (one per line) *</label>
            <textarea id="team-qualifications" rows="4" required></textarea>
        </div>
        
        <div class="form-group">
            <label>Display Order</label>
            <input type="number" id="team-order" value="0" min="0">
        </div>
        
        <div class="form-group">
            <label>Photo</label>
            <input type="file" id="team-photo" accept="image/*">
            <small style="color: #666;">Leave empty to keep existing photo</small>
            <div class="photo-preview" id="photo-preview"></div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="button" onclick="saveTeamMember()" class="btn-save">Save Team Member</button>
            <button type="button" onclick="clearTeamForm()" style="background: #666; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer;">Clear</button>
        </div>
    </div>
    
    <!-- Team Members List -->
    <h3>Current Team Members</h3>
    <div id="team-list"></div>
</div>

<!-- For local development ONLY -->
<script>
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        document.write('<script src="assets/js/config.js"><\/script>');
    }
</script>

<script type="module">
    import { supabase } from './assets/js/supabase.js'
    
    // ==================== AUTH ====================
    window.login = function() {
        const user = document.getElementById('username').value
        const pass = document.getElementById('password').value
        if (user === 'admin' && pass === 'admin123') {
            document.getElementById('login-form').classList.add('hidden')
            document.getElementById('admin-panel').classList.remove('hidden')
            loadSettings()
            loadTeamMembers()
        } else {
            alert('Invalid credentials')
        }
    }
    
    window.logout = function() {
        document.getElementById('login-form').classList.remove('hidden')
        document.getElementById('admin-panel').classList.add('hidden')
    }
    
    // ==================== SITE SETTINGS ====================
    async function loadSettings() {
        const { data, error } = await supabase
            .from('site_settings')
            .select('*')
            .eq('id', 1)
            .single()
        
        if (error) {
            alert('Error loading: ' + error.message)
            return
        }
        
        document.getElementById('contact_email').value = data.contact_email || ''
        document.getElementById('contact_phone').value = data.contact_phone || ''
        document.getElementById('contact_address').value = data.contact_address || ''
        document.getElementById('address_note').value = data.address_note || ''
        document.getElementById('business_hours').value = data.business_hours || ''
        document.getElementById('facebook_url').value = data.facebook_url || ''
        document.getElementById('instagram_url').value = data.instagram_url || ''
        document.getElementById('whatsapp_url').value = data.whatsapp_url || ''
        document.getElementById('linkedin_url').value = data.linkedin_url || ''
        document.getElementById('copyright_text').value = data.copyright_text || ''
    }
    
    document.getElementById('settings-form').addEventListener('submit', async (e) => {
        e.preventDefault()
        
        const settings = {
            contact_email: document.getElementById('contact_email').value,
            contact_phone: document.getElementById('contact_phone').value,
            contact_address: document.getElementById('contact_address').value,
            address_note: document.getElementById('address_note').value,
            business_hours: document.getElementById('business_hours').value,
            facebook_url: document.getElementById('facebook_url').value,
            instagram_url: document.getElementById('instagram_url').value,
            whatsapp_url: document.getElementById('whatsapp_url').value,
            linkedin_url: document.getElementById('linkedin_url').value,
            copyright_text: document.getElementById('copyright_text').value
        }
        
        const { error } = await supabase
            .from('site_settings')
            .update(settings)
            .eq('id', 1)
        
        if (error) {
            alert('❌ Error: ' + error.message)
        } else {
            alert('✅ Settings saved!')
            await loadSettings()
        }
    })
    
    // ==================== TEAM MEMBERS ====================
    let currentPhotoFile = null;
    
    // Handle photo selection
    document.getElementById('team-photo')?.addEventListener('change', function(e) {
        currentPhotoFile = e.target.files[0];
        if (currentPhotoFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('photo-preview').innerHTML = 
                    `<img src="${e.target.result}" style="max-width: 100px; max-height: 100px; border-radius: 5px;">`;
            };
            reader.readAsDataURL(currentPhotoFile);
        }
    });
    
    window.loadTeamMembers = async function() {
        const { data, error } = await supabase
            .from('team_members')
            .select('*')
            .order('display_order', { ascending: true });
        
        if (error) {
            console.error('Error loading team:', error);
            return;
        }
        
        const container = document.getElementById('team-list');
        if (!container) return;
        
        if (data.length === 0) {
            container.innerHTML = '<p>No team members added yet.</p>';
            return;
        }
        
        container.innerHTML = data.map(member => `
            <div class="team-member-item">
                ${member.photo_url ? 
                    `<img src="${member.photo_url}" alt="${member.name}" class="team-photo-small">` : 
                    `<div class="photo-placeholder">📷</div>`
                }
                <div class="team-info">
                    <strong>${member.name}</strong><br>
                    <span style="color: #666;">${member.role}</span>
                </div>
                <div>
                    <button onclick="editTeamMember(${member.id})" class="btn-edit">Edit</button>
                    <button onclick="deleteTeamMember(${member.id})" class="btn-delete">Delete</button>
                </div>
            </div>
        `).join('');
    };
    
    window.saveTeamMember = async function() {
        const id = document.getElementById('team-id').value;
        const name = document.getElementById('team-name').value;
        const role = document.getElementById('team-role').value;
        const qualifications = document.getElementById('team-qualifications').value;
        const display_order = parseInt(document.getElementById('team-order').value) || 0;
        
        if (!name || !role || !qualifications) {
            alert('Please fill all required fields');
            return;
        }
        
        let photo_url = null;
        
        // Upload photo if selected
        if (currentPhotoFile) {
            const fileExt = currentPhotoFile.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
            const filePath = `team/${fileName}`;
            
            const { error: uploadError } = await supabase.storage
                .from('team-photos')
                .upload(filePath, currentPhotoFile);
            
            if (uploadError) {
                alert('Error uploading photo: ' + uploadError.message);
                return;
            }
            
            const { data: { publicUrl } } = supabase.storage
                .from('team-photos')
                .getPublicUrl(filePath);
            
            photo_url = publicUrl;
        }
        
        const memberData = {
            name,
            role,
            qualifications,
            display_order,
            ...(photo_url && { photo_url })
        };
        
        let error;
        if (id) {
            ({ error } = await supabase
                .from('team_members')
                .update(memberData)
                .eq('id', id));
        } else {
            ({ error } = await supabase
                .from('team_members')
                .insert([memberData]));
        }
        
        if (error) {
            alert('Error saving: ' + error.message);
        } else {
            alert('Team member saved!');
            clearTeamForm();
            loadTeamMembers();
        }
    };
    
    window.editTeamMember = async function(id) {
        const { data, error } = await supabase
            .from('team_members')
            .select('*')
            .eq('id', id)
            .single();
        
        if (error) {
            alert('Error loading: ' + error.message);
            return;
        }
        
        document.getElementById('team-id').value = data.id;
        document.getElementById('team-name').value = data.name;
        document.getElementById('team-role').value = data.role;
        document.getElementById('team-qualifications').value = data.qualifications;
        document.getElementById('team-order').value = data.display_order || 0;
        
        if (data.photo_url) {
            document.getElementById('photo-preview').innerHTML = 
                `<img src="${data.photo_url}" style="max-width: 100px; max-height: 100px; border-radius: 5px;">`;
        }
        
        document.getElementById('team-form-title').textContent = 'Edit Team Member';
        currentPhotoFile = null;
    };
    
    window.deleteTeamMember = async function(id) {
        if (!confirm('Are you sure you want to delete this team member?')) return;
        
        const { error } = await supabase
            .from('team_members')
            .delete()
            .eq('id', id);
        
        if (error) {
            alert('Error deleting: ' + error.message);
        } else {
            loadTeamMembers();
        }
    };
    
    window.clearTeamForm = function() {
        document.getElementById('team-id').value = '';
        document.getElementById('team-name').value = '';
        document.getElementById('team-role').value = '';
        document.getElementById('team-qualifications').value = '';
        document.getElementById('team-order').value = '0';
        document.getElementById('photo-preview').innerHTML = '';
        document.getElementById('team-form-title').textContent = 'Add New Team Member';
        currentPhotoFile = null;
        document.getElementById('team-photo').value = '';
    };
</script>

</body>
</html>
